<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Configurações básicas -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064a35" />

    <!-- SEO Google -->
    <title>Speers Foods | Distribuidora de Alimentos Congelados em SP</title>

    <meta
      name="description"
      content="A Speers Foods é uma distribuidora de alimentos congelados em São Paulo, com mais de 20 anos de história. Atendemos mercados, restaurantes e redes comerciais."
    />

    <meta name="robots" content="index, follow" />

    <!-- Endereço oficial -->
    <link rel="canonical" href="https://speers-foods-site.onrender.com/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" />

    <!-- Compartilhamento WhatsApp e redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Speers Foods" />

    <meta property="og:url" content="https://speers-foods-site.onrender.com/" />

    <meta
      property="og:title"
      content="Speers Foods | Distribuidora de Alimentos Congelados"
    />

    <meta
      property="og:description"
      content="Mais de 20 anos distribuindo alimentos congelados em São Paulo. Conheça nossos produtos e marcas parceiras."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      property="og:image"
      content="https://speers-foods-site.onrender.com/og-image.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://speers-foods-site.onrender.com/og-image.png"
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />

    <meta
      property="og:image:alt"
      content="Speers Foods - Distribuidora de Alimentos Congelados"
    />
    <meta
      name="twitter:description"
      content="Conheça a Speers Foods, distribuidora de alimentos congelados em São Paulo."
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
